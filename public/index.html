<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Latency Voice Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="layout">
    <section class="left">
      <header class="brand">
        <h1>🎙️ Low-Latency Voice Assistant</h1>
        <p class="subtitle">Sarvam STT/TTS · Qdrant RAG · Gemini (Vertex AI) · Redis cache</p>
      </header>

      <div class="mic-stage">
        <button id="micBtn" class="mic-btn" aria-label="Start talking">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
            <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="status" class="status">Idle</div>
      </div>
    </section>

    <section class="right">
      <div class="card">
        <h2>Your Message</h2>
        <div id="transcript" class="scrollbox"></div>
      </div>

      <div class="card">
        <h2>Assistant Response</h2>
        <div id="reply" class="scrollbox"></div>
      </div>

      <div class="card latency-card">
        <h2>Latency</h2>
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">First audio</span>
            <span class="metric-value" id="latFirstAudio">–</span>
          </div>
          <div class="metric">
            <span class="metric-label">RAG</span>
            <span class="metric-value" id="latRag">–</span>
          </div>
          <div class="metric">
            <span class="metric-label">LLM</span>
            <span class="metric-value" id="latLlm">–</span>
          </div>
        </div>
      </div>

      <button id="clearBtn" class="clear-btn">Clear</button>
    </section>
  </main>
  <script src="client.js"></script>
</body>
</html>
